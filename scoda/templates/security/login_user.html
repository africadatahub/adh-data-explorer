<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-3">Login</h1>
            <form action="{{ url_for('security.login') }}" method="POST">
              {{ login_user_form.hidden_tag() }}
              <div class="form-group">
                {{ login_user_form.email(placeholder="Email", class="form-control", required="True") }}
              </div>
              <div class="form-group">
                {{ login_user_form.password(placeholder="Password", class="form-control", required="True") }}
              </div>
              <button type="submit" class="btn btn-primary">Login</button>
              <a class="btn btn-link" href="{{ url_for('security.forgot_password') }}">Forgot password?</a>
            </form>
          </div>
        </div>
        <p class="text-center mt-3"><a href="/home/">Return to Data Explorer</a></p>
      </div>
    </div>
  </div>
</body>
</html>
